# Cloud Build configuration for GCP Cloud Run deployment
# Deploy with: gcloud builds submit --config cloudbuild.yaml

steps:
  # Build the container image
  - name: "gcr.io/cloud-builders/docker"
    args: ["build", "-t", "gcr.io/$PROJECT_ID/tjh-backend:$COMMIT_SHA", "."]
    dir: "backend"

  # Push the container image to Container Registry
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/$PROJECT_ID/tjh-backend:$COMMIT_SHA"]

  # Deploy to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "tjh-backend"
      - "--image=gcr.io/$PROJECT_ID/tjh-backend:$COMMIT_SHA"
      - "--region=us-central1"
      - "--platform=managed"
      - "--allow-unauthenticated"
      - "--memory=512Mi"
      - "--cpu=1"
      - "--min-instances=0"
      - "--max-instances=10"
      - "--timeout=300s"

# Substitutions (can be overridden)
substitutions:
  _REGION: us-central1

# Images to store in Container Registry
images:
  - "gcr.io/$PROJECT_ID/tjh-backend:$COMMIT_SHA"

# Build options
options:
  logging: CLOUD_LOGGING_ONLY
